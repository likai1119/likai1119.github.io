<script>
    // 封装图片切换功能为可复用函数
    function createImageToggle(options) {
        // 从选项中获取元素ID
        const {
            active1Id = 'active1',
            active2Id = 'active2',
            active3Id = 'active3',
            active4Id = 'active4',
            images1Id = 'iamges1',
            images2Id = 'iamges2'
        } = options;

        // 获取元素
        const active1 = document.getElementById(active1Id);
        const active2 = document.getElementById(active2Id);
        const active3 = document.getElementById(active3Id);
        const active4 = document.getElementById(active4Id);
        const images1 = document.getElementById(images1Id);
        const images2 = document.getElementById(images2Id);

        // 检查所有元素是否存在
        if (!active1 || !active2 || !active3 || !active4 || !images1 || !images2) {
            console.error('Missing required elements for image toggle');
            return;
        }

        // 点击 active4 时的处理函数
        active4.addEventListener('click', function () {
            // 显示 active3，隐藏 active2
            active3.style.display = 'block';
            active2.style.display = 'none';

            // 显示 active1
            active1.style.display = 'block';
            active4.style.display = 'none';

            // 显示 image2，隐藏 image1
            images2.style.display = 'block';
            images1.style.display = 'none';
        });

        // 点击 active1 时的处理函数
        active1.addEventListener('click', function () {
            // 显示 active2，隐藏 active1
            active2.style.display = 'block';
            active1.style.display = 'none';

            // 显示 active4，隐藏 active3
            active4.style.display = 'block';
            active3.style.display = 'none';

            // 显示 image1，隐藏 image2
            images1.style.display = 'block';
            images2.style.display = 'none';
        });

        // 返回一个对象，包含重置方法等
        return {
            reset: function () {
                // 重置到初始状态
                active1.style.display = 'none';
                active2.style.display = 'block';
                active3.style.display = 'none';
                active4.style.display = 'block';
                images1.style.display = 'block';
                images2.style.display = 'none';
            }
        };
    }

    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function () {
        // 初始化第一个图片切换实例
        const imageToggle1 = createImageToggle({
            active1Id: 'active1',
            active2Id: 'active2',
            active3Id: 'active3',
            active4Id: 'active4',
            images1Id: 'iamges1',
            images2Id: 'iamges2'
        });

        // 初始化第二个图片切换实例
        const imageToggle2 = createImageToggle({
            active1Id: 'active1_2',

        });
        // 初始化第三个图片切换实例
        const imageToggle3 = createImageToggle({

        });
        // 初始化第三个图片切换实例
        const imageToggle4 = createImageToggle({

        // 初始化第四个图片切换实例
